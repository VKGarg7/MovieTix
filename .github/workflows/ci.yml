name: CI

on:
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Fake values only — never real secrets — so PRs from forks can build
        # without access to repo secrets. Vite only needs these to be defined
        # at build time; nothing here is called against a real backend.
        env:
          VITE_BASE_URL: http://localhost:3000
          VITE_TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p/original
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_stub
          VITE_CURRENCY: $
        run: npm run build

  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Test
        run: npm test
